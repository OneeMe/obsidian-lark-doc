name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version: current, patch, minor, major, or x.y.z"
                required: true
                default: "current"
            prerelease:
                description: "Mark the GitHub release as prerelease"
                required: true
                type: boolean
                default: false

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"

            - run: npm ci

            - name: Prepare release metadata
              if: ${{ inputs.version != 'current' }}
              run: npm run release:prepare -- "${{ inputs.version }}"

            - run: npm run lint
            - run: npm test
            - run: npm run test:coverage
            - run: npm run build
            - run: npm run release:validate

            - name: Read release version
              id: release
              run: |
                  version="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version)")"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  npm --silent run release:notes -- "$version" > release-notes.md

            - name: Ensure release tag is new
              run: |
                  if git rev-parse "${{ steps.release.outputs.version }}" >/dev/null 2>&1; then
                      echo "Tag ${{ steps.release.outputs.version }} already exists." >&2
                      exit 1
                  fi

            - name: Commit release metadata
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json manifest.json versions.json
                  if ! git diff --cached --quiet; then
                      git commit -m "chore: release ${{ steps.release.outputs.version }}"
                      git push origin "HEAD:${GITHUB_REF_NAME}"
                  fi

            - name: Generate release asset attestations
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create and push tag
              run: |
                  git tag "${{ steps.release.outputs.version }}"
                  git push origin "${{ steps.release.outputs.version }}"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  prerelease_flag=""
                  if [ "${{ inputs.prerelease }}" = "true" ]; then
                      prerelease_flag="--prerelease"
                  fi
                  gh release create "${{ steps.release.outputs.version }}" \
                      main.js manifest.json styles.css \
                      --repo "${GITHUB_REPOSITORY}" \
                      --title "${{ steps.release.outputs.version }}" \
                      --notes-file release-notes.md \
                      ${prerelease_flag}
